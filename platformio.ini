; only tests native
; -----------------


[env:native]
platform = native
lib_deps =
  googletest@1.8.1
build_flags =
  -std=c++11
lib_archive = false
test_ignore = embedded*
;src_dir = tests/testSignalDecoder
lib_compat_mode = off
